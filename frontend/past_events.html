    <script>
        // Initialize AOS
        AOS.init({
            duration: 1000,
            easing: 'ease-in-out',
            once: true,
            mirror: false
        });
        
        // Create floating particles
        function createParticles() {
            const particlesBg = document.getElementById('particlesBg');
            const particleCount = 25; // Reduced from 50
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's'; // Reduced from 6s
                particle.style.animationDuration = (Math.random() * 2 + 2) + 's'; // Reduced from 3+3s
                particlesBg.appendChild(particle);
            }
        }
        
        // Loading screen - faster transition
        window.addEventListener('load', function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            setTimeout(() => {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 300); // Reduced from 500ms
            }, 800); // Reduced from 1500ms
        });
        
        // Smooth scrolling for anchor links
        document.addEventListener('DOMContentLoaded', function() {
            // Create particles with slight delay
            setTimeout(createParticles, 100);
            
            // Check if there's a hash in the URL and scroll to that section
            if (window.location.hash) {
                const targetElement = document.querySelector(window.location.hash);
                if (targetElement) {
                    setTimeout(() => {
                        targetElement.scrollIntoView({ behavior: 'smooth' });
                    }, 100);
                }
            }
            
            // Initialize counting animation
            initCountingAnimation();
        });
        
        // Enhanced counting animation function
        function initCountingAnimation() {
            const statNumbers = document.querySelectorAll('.stat-number');
            
            // Create intersection observer to trigger animation when elements come into view
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = entry.target;
                        if (!target.classList.contains('animated')) {
                            animateNumber(target);
                            target.classList.add('animated');
                        }
                    }
                });
            }, {
                threshold: 0.3, // Reduced from 0.5 for earlier triggering
                rootMargin: '0px 0px -30px 0px' // Reduced from -50px
            });
            
            // Observe all stat numbers
            statNumbers.forEach(stat => {
                observer.observe(stat);
            });
        }
        
        // Enhanced animate individual number - faster animation
        function animateNumber(element) {
            const finalText = element.textContent;
            const finalNumber = parseInt(finalText.replace(/\D/g, '')); // Extract number
            const hasPlus = finalText.includes('+');
            
            let currentNumber = 0;
            const duration = 1800; // Reduced from 2500ms
            const steps = 60; // Reduced from 80 for faster updates
            const increment = finalNumber / steps;
            const stepDuration = duration / steps;
            
            // Add a subtle bounce effect
            element.style.transform = 'scale(1.05)'; // Reduced from 1.1
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 80); // Reduced from 100ms
            
            const timer = setInterval(() => {
                currentNumber += increment;
                
                if (currentNumber >= finalNumber) {
                    currentNumber = finalNumber;
                    clearInterval(timer);
                    
                    // Final bounce effect
                    element.style.transform = 'scale(1.02)'; // Reduced from 1.05
                    setTimeout(() => {
                        element.style.transform = 'scale(1)';
                    }, 150); // Reduced from 200ms
                }
                
                // Format the number with plus sign if needed
                const displayText = hasPlus ? Math.floor(currentNumber) + '+' : Math.floor(currentNumber);
                element.textContent = displayText;
            }, stepDuration);
        }
        
        // Parallax effect for particles - optimized
        let ticking = false;
        window.addEventListener('scroll', function() {
            if (!ticking) {
                requestAnimationFrame(function() {
                    const scrolled = window.pageYOffset;
                    const particles = document.querySelectorAll('.particle');
                    
                    particles.forEach((particle, index) => {
                        const speed = 0.3 + (index % 2) * 0.1; // Reduced speed
                        particle.style.transform = `translateY(${scrolled * speed}px)`;
                    });
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>
